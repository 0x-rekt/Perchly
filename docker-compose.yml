services:
  db:
    image: timescale/timescaledb:latest-pg17
    container_name: perchly-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-perchly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-perchly}
      POSTGRES_DB: ${POSTGRES_DB:-perchly}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - perchly-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12

  temporal:
    image: temporalio/temporal:latest
    container_name: perchly-temporal
    restart: unless-stopped
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-port", "8233"]
    ports:
      - "7233:7233"
      - "8233:8233"

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: perchly-server
    restart: unless-stopped
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DATABASE_URL=postgresql://${POSTGRES_USER:-perchly}:${POSTGRES_PASSWORD:-perchly}@db:5432/${POSTGRES_DB:-perchly}?sslmode=disable
      - GITHUB_PRIVATE_KEY_PATH=/app/perchly.2026-09-12.private-key.pem
      - PERCHLY_DATA_DIRECTORY=/app/data
    volumes:
      - ./server/data:/app/data
      - ./server/perchly.2026-09-12.private-key.pem:/app/perchly.2026-09-12.private-key.pem:ro
    depends_on:
      temporal:
        condition: service_started
      db:
        condition: service_healthy

  worker:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: perchly-worker
    restart: unless-stopped
    command: ["uv", "run", "python", "-m", "app.temporal.worker"]
    env_file:
      - path: ./server/.env
        required: false
      - path: ./.env
        required: false
    environment:
      - TEMPORAL_ADDRESS=temporal:7233
      - DATABASE_URL=postgresql://${POSTGRES_USER:-perchly}:${POSTGRES_PASSWORD:-perchly}@db:5432/${POSTGRES_DB:-perchly}?sslmode=disable
      - GITHUB_PRIVATE_KEY_PATH=/app/perchly.2026-09-12.private-key.pem
      - PERCHLY_DATA_DIRECTORY=/app/data
    volumes:
      - ./server/data:/app/data
      - ./server/perchly.2026-09-12.private-key.pem:/app/perchly.2026-09-12.private-key.pem:ro
    depends_on:
      temporal:
        condition: service_started
      server:
        condition: service_started
      db:
        condition: service_healthy

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: perchly-web
    restart: unless-stopped
    ports:
      - "5173:5173"
    depends_on:
      - server

  ngrok:
    image: ngrok/ngrok:latest
    container_name: perchly-ngrok
    restart: unless-stopped
    command:
      - "http"
      - "--url=${NGROK_DOMAIN:-special-oriole-remotely.ngrok-free.app}"
      - "server:8000"
    env_file:
      - path: ./.env
        required: false
      - path: ./server/.env
        required: false
    depends_on:
      - server

volumes:
  perchly-postgres:
