[project]
name = "perchly"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "google-genai>=1.68.0",
    "httpx>=0.28.1",
    "pydantic>=2.13.5",
    "pyjwt[crypto]>=2.10.1",
    "python-dotenv>=1.2.3",
    "pytest>=9.0.2",
    "uvicorn>=0.52.4",
    "pgvector>=0.5.0",
    "pg8000>=1.31.5",
    "temporalio>=1.33.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: requires live Neon and Gemini credentials",
]
